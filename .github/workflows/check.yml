name: Ticket check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # needed to save state.json

concurrency:
  group: ticket-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check tickets
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          EVENT_IDS: ${{ secrets.EVENT_IDS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tm_check.py

      - name: Save state if changed
        run: |
          git config user.name "ticket-bot"
          git config user.email "ticket-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update state" && git push)
